<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر مستلزمات الصيانة والإكسسوارات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- الهيدر / الشريط العلوي -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <i class="fa-solid fa-microchip text-blue-500 text-2xl"></i>
                <h1 class="font-bold text-xl tracking-wide">الحلول التقنية للجملة</h1>
            </div>
            
            <div class="flex items-center space-x-3 space-x-reverse">
                <!-- زر تسجيل دخول أصحاب المحلات -->
                <button id="authBtn" onclick="toggleAuthModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 transition">
                    <i class="fa-solid fa-lock"></i>
                    <span id="authBtnText">دخول المحلات</span>
                </button>
                
                <!-- زر السلة -->
                <button onclick="toggleCartModal()" class="relative bg-slate-800 hover:bg-slate-700 text-white p-2.5 rounded-lg transition">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- القسم الرئيسي -->
    <main class="container mx-auto px-4 py-6">
        <!-- أشرطة البحث والتصنيف -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute right-3 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="ابحث عن قطعة، صنف، أو خدمة..." class="w-full pr-10 pl-4 py-2.5 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <select id="categoryFilter" onchange="filterProducts()" class="bg-white border border-slate-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="ALL">جميع التصنيفات</option>
                <option value="اكسسوارات">إكسسوارات</option>
                <option value="عدة صيانة">عدة صيانة</option>
                <option value="خدمات">خدمات إلكترونية</option>
            </select>
        </div>

        <!-- شبكة عرض المنتجات -->
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- سيتم تحميل المنتجات هنا ديناميكياً -->
            <div class="col-span-full text-center py-12 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-blue-600"></i>
                <p>جاري تحميل المنتجات والأسعار...</p>
            </div>
        </div>
    </main>

    <!-- نافذة تسجيل الدخول للمحلات -->
    <div id="authModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-slate-900">دخول أصحاب المحلات</h3>
                <button onclick="toggleAuthModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <p class="text-sm text-slate-600 mb-4">أدخل الرمز السري المخصص لمحلّك لعرض أسعار الجملة الخاصة بك.</p>
            <input type="password" id="passcodeKey" placeholder="أدخل الرمز السري" class="w-full border border-slate-300 rounded-xl p-3 mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="loginShop()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">تأكيد الدخول</button>
        </div>
    </div>

    <!-- نافذة سلة التسوق -->
    <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 flex justify-end hidden">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-slate-900 text-white">
                <h3 class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-basket-shopping"></i> سلة الطلبات</h3>
                <button onclick="toggleCartModal()" class="text-slate-300 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- عناصر السلة -->
            </div>

            <div class="p-4 border-t bg-slate-50 space-y-3">
                <div id="cartTotalPrice" class="flex justify-between font-bold text-slate-900 text-lg hidden">
                    <span>الإجمالي التقديري:</span>
                    <span id="totalAmount">0</span>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">اسم المحل / صاحب الطلب *</label>
                    <input type="text" id="shopNameInput" placeholder="مثال: محل النجم - الميدان" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>إرسال الطلب عبر واتساب</span>
                </button>
            </div>
        </div>
    </div>

    <!-- السكربت البرمجي الرئيسي -->
    <script>
        // === ضع رابط الـ Web App الخاص بك من Google Apps Script هنا ===
        const API_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";
        
        // رقم الواتساب الخاص بك (مباشرة مع رمز البلد دون + أو أصفار زرقاء، مثال سوريا: 9639xxxxxxx)
        const MY_WHATSAPP_NUMBER = "963900000000"; 
        
        // رمز دخول أصحاب المحلات الموحد (يمكنك تغييره كما تشاء)
        const VALID_PASSCODE = "123456";

        let allProducts = [];
        let cart = [];
        let isLoggedIn = localStorage.getItem("isShopLoggedIn") === "true";

        // التشغيل عند فتح الصفحة
        window.onload = () => {
            updateAuthUI();
            fetchProducts();
        };

        // جلب البيانات من Google Sheet API
        async function fetchProducts() {
            try {
                const res = await fetch(API_URL);
                allProducts = await res.json();
                renderProducts(allProducts);
            } catch (err) {
                document.getElementById("productsGrid").innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p>عذراً، حدث خطأ أثناء تحميل البيانات. يرجى التتحقق من رابط الـ API.</p>
                    </div>`;
            }
        }

        // عرض المنتجات
        function renderProducts(products) {
            const grid = document.getElementById("productsGrid");
            if(products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">لا توجد منتجات متطابقة مع البحث.</div>`;
                return;
            }

            grid.innerHTML = products.map(p => {
                const hasPrice = isLoggedIn && p.price;
                return `
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                    <img src="${p.image || 'https://via.placeholder.com/300x200?text=No+Image'}" class="w-full h-44 object-cover border-b" alt="${p.name}">
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">${p.category || 'عام'}</span>
                            <h4 class="font-bold text-slate-900 mt-2 text-base leading-snug">${p.name}</h4>
                            <p class="text-xs text-slate-500 mt-1 line-clamp-2">${p.description || ''}</p>
                        </div>
                        
                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <div>
                                ${hasPrice 
                                    ? `<span class="text-blue-600 font-bold text-lg">${p.price}</span>` 
                                    : `<button onclick="toggleAuthModal()" class="text-xs text-amber-600 font-semibold hover:underline"><i class="fa-solid fa-lock text-xs"></i> سعر الجملة</button>`
                                }
                            </div>
                            <button onclick='addToCart(${JSON.stringify(p)})' class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-plus"></i> إضافة
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // تصفية المنتجات بالبحث والتصنيف
        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const cat = document.getElementById("categoryFilter").value;

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query));
                const matchesCat = cat === "ALL" || p.category === cat;
                return matchesSearch && matchesCat;
            });
            renderProducts(filtered);
        }

        // إدارة الحسابات والرمز السري
        function toggleAuthModal() {
            document.getElementById("authModal").classList.toggle("hidden");
        }

        function loginShop() {
            const code = document.getElementById("passcodeKey").value;
            if(code === VALID_PASSCODE) {
                isLoggedIn = true;
                localStorage.setItem("isShopLoggedIn", "true");
                updateAuthUI();
                toggleAuthModal();
                renderProducts(allProducts);
                renderCart();
            } else {
                alert("الرمز السري غير صحيح!");
            }
        }

        function updateAuthUI() {
            const btnText = document.getElementById("authBtnText");
            if(isLoggedIn) {
                btnText.innerText = "حساب محلات مفعّل";
                document.getElementById("authBtn").classList.replace("bg-blue-600", "bg-emerald-600");
            }
        }

        // السلة والطلبات
        function toggleCartModal() {
            document.getElementById("cartModal").classList.toggle("hidden");
        }

        function addToCart(product) {
            const exist = cart.find(item => item.id === product.id);
            if(exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...product, qty: 1, customInput: '' });
            }
            updateCart();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCart();
        }

        function updateCustomInput(id, val) {
            const item = cart.find(i => i.id === id);
            if(item) item.customInput = val;
        }

        function updateCart() {
            const badge = document.getElementById("cartBadge");
            const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
            
            if(totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
            
            renderCart();
        }

        function renderCart() {
            const cartItemsContainer = document.getElementById("cartItems");
            if(cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-center text-slate-400 py-8">السلة فارغة حالياً</p>`;
                document.getElementById("cartTotalPrice").classList.add("hidden");
                return;
            }

            let totalSum = 0;

            cartItemsContainer.innerHTML = cart.map(item => {
                const priceNum = parseFloat(item.price) || 0;
                if(isLoggedIn && priceNum) totalSum += priceNum * item.qty;

                return `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div class="flex justify-between items-start">
                        <h5 class="font-bold text-sm text-slate-800">${item.name}</h5>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 bg-slate-200 rounded text-slate-700 font-bold">-</button>
                            <span class="text-sm font-semibold">${item.qty}</span>
                            <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 bg-slate-200 rounded text-slate-700 font-bold">+</button>
                        </div>
                    </div>
                    
                    ${item.requiresInput === 'true' ? `
                        <input type="text" onchange="updateCustomInput('${item.id}', this.value)" placeholder="أدخل البيانات (مثل: IMEI / نوع الجهاز)" class="w-full mt-2 border rounded p-1.5 text-xs outline-none focus:ring-1 focus:ring-blue-500">
                    ` : ''}

                    ${isLoggedIn && item.price ? `
                        <div class="text-left mt-2 text-xs font-bold text-blue-600">
                            ${(priceNum * item.qty)}
                        </div>
                    ` : ''}
                </div>
                `;
            }).join('');

            if(isLoggedIn && totalSum > 0) {
                document.getElementById("cartTotalPrice").classList.remove("hidden");
                document.getElementById("totalAmount").innerText = totalSum;
            }
        }

        // إرسال الطلب للواتساب
        function sendToWhatsApp() {
            const shopName = document.getElementById("shopNameInput").value.trim();
            if(!shopName) {
                alert("يرجى إدخال اسم المحل أو اسمك قبل إرسال الطلب.");
                return;
            }
            if(cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            let text = `📦 *طلب جديد من متجر الجملة*\n`;
            text += `🏪 *المحل/العميل:* ${shopName}\n`;
            text += `-----------------------------------\n\n`;

            cart.forEach((item, index) => {
                text += `${index + 1}. *${item.name}* (الكمية: ${item.qty})\n`;
                if(item.customInput) {
                    text += `   📝 البيانات: ${item.customInput}\n`;
                }
            });

            text += `\n-----------------------------------\n`;
            text += `يرجى تأكيد إمكانية التجهيز والتوفر.`;

            const encodedText = encodeURIComponent(text);
            const whatsappURL = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodedText}`;
            window.open(whatsappURL, '_blank');
        }
    </script>
</body>
</html>
