<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zir Technical Solutions - الحلول التقنية للجملة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- الشريط العلوي (Header) -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <i class="fa-solid fa-microchip text-blue-500 text-2xl"></i>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Zir Technical Solutions</h1>
                    <p class="text-[10px] text-slate-400">مستلزمات محلات الموبايل والصيانة</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3 space-x-reverse">
                <!-- زر تسجيل دخول أصحاب المحلات -->
                <button id="authBtn" onclick="toggleAuthModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-lock text-xs"></i>
                    <span id="authBtnText">دخول المحلات</span>
                </button>
                
                <!-- زر السلة -->
                <button onclick="toggleCartModal()" class="relative bg-slate-800 hover:bg-slate-700 text-white p-2 rounded-lg transition">
                    <i class="fa-solid fa-cart-shopping text-base"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-6">
        <!-- خيارات البحث والتصنيف -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute right-3 top-3.5 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="ابحث عن قطعة، صنف، أو خدمة..." class="w-full pr-9 pl-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <select id="categoryFilter" onchange="filterProducts()" class="bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="ALL">جميع التصنيفات</option>
                <option value="اكسسوارات">إكسسوارات</option>
                <option value="عدة صيانة">عدة صيانة</option>
                <option value="خدمات">خدمات إلكترونية</option>
            </select>
        </div>

        <!-- شبكة عرض المنتجات -->
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-12 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-blue-600"></i>
                <p class="text-sm">جاري تحميل البضائع من الجدول...</p>
            </div>
        </div>
    </main>

    <!-- نافذة تسجيل الدخول لأصحاب المحلات -->
    <div id="authModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-base text-slate-900">دخول أصحاب المحلات</h3>
                <button onclick="toggleAuthModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-600 mb-4">أدخل كود الحساب المخصص لمحلّك لعرض أسعار الجملة الخاصة بك.</p>
            <input type="password" id="passcodeKey" placeholder="أدخل رمز الدخول" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="loginShop()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-sm transition">تأكيد الدخول</button>
        </div>
    </div>

    <!-- نافذة سلة التسوق الجانبية -->
    <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 flex justify-end hidden">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-slate-900 text-white">
                <h3 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-basket-shopping"></i> سلة الطلبات</h3>
                <button onclick="toggleCartModal()" class="text-slate-300 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- محتويات السلة -->
            </div>

            <div class="p-4 border-t bg-slate-50 space-y-3">
                <div id="cartTotalPrice" class="flex justify-between font-bold text-slate-900 text-base hidden">
                    <span>المجموع التقديري:</span>
                    <span id="totalAmount">0</span>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">اسم المحل / صاحب الطلب *</label>
                    <input type="text" id="shopNameInput" placeholder="مثال: محل المركز الفني - المعضمية" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm flex items-center justify-center gap-2 transition">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>تأكيد وإرسال الطلب عبر الواتساب</span>
                </button>
            </div>
        </div>
    </div>

    <!-- السكربت البرمجي -->
    <script>
        // رابط جدول البيانات الخاص بك مُربوط جاهزاً
        const SHEET_ID = "1ZGHu7tRsPaVlXW-fbKiwzD20NvKbD0KiwH3eAn6BDEI";
        const API_URL = `https://opensheet.elk.sh/${SHEET_ID}/1`;

        // رقم الواتساب الخاص بك بالصيغة الدولية بدون + (أدخل رقمك مكان الأصفار)
        const MY_WHATSAPP_NUMBER = "963900000000"; 

        // رمز دخول أصحاب المحلات الموحد (يمكنك تغييره بحرية)
        const VALID_PASSCODE = "123456";

        let allProducts = [];
        let cart = [];
        let isLoggedIn = localStorage.getItem("isShopLoggedIn") === "true";

        window.onload = () => {
            updateAuthUI();
            fetchProducts();
        };

        // جلب البيانات مباشرة وبصورة مجانية 100%
        async function fetchProducts() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("تعذر جلب البيانات");
                allProducts = await res.json();
                renderProducts(allProducts);
            } catch (err) {
                document.getElementById("productsGrid").innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p class="font-semibold text-sm">عذراً، تعذر جلب المنتجات من الجدول.</p>
                        <p class="text-xs text-slate-500 mt-1">تأكد من أن مشاركة ملف Google Sheet ضبطت على: "Anyone with the link can view".</p>
                    </div>`;
            }
        }

        // عرض شبكة المنتجات
        function renderProducts(products) {
            const grid = document.getElementById("productsGrid");
            if (!products || products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-sm">لا توجد منتجات متاحة حالياً.</div>`;
                return;
            }

            grid.innerHTML = products.map((p, index) => {
                const itemId = p.id || `item_${index}`;
                const hasPrice = isLoggedIn && p.price;
                return `
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                    <img src="${p.image || 'https://via.placeholder.com/300x200?text=No+Image'}" class="w-full h-40 object-cover border-b bg-slate-100" alt="${p.name || ''}">
                    <div class="p-3.5 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">${p.category || 'عام'}</span>
                            <h4 class="font-bold text-slate-900 mt-1.5 text-sm leading-snug">${p.name || 'منتج بدون اسم'}</h4>
                            <p class="text-xs text-slate-500 mt-1 line-clamp-2">${p.description || ''}</p>
                        </div>
                        
                        <div class="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between">
                            <div>
                                ${hasPrice 
                                    ? `<span class="text-blue-600 font-bold text-base">${p.price}</span>` 
                                    : `<button onclick="toggleAuthModal()" class="text-[11px] text-amber-600 font-semibold hover:underline flex items-center gap-1"><i class="fa-solid fa-lock text-[10px]"></i> أسعار الجملة</button>`
                                }
                            </div>
                            <button onclick='addToCart(${JSON.stringify({...p, id: itemId}).replace(/'/g, "&apos;")})' class="bg-slate-900 hover:bg-slate-800 text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 transition">
                                <i class="fa-solid fa-plus text-[10px]"></i> إضافة
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // فلترة بالبحث والتصنيف
        function filterProducts() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const cat = document.getElementById("categoryFilter").value;

            const filtered = allProducts.filter(p => {
                const nameMatch = p.name && p.name.toLowerCase().includes(query);
                const descMatch = p.description && p.description.toLowerCase().includes(query);
                const matchesSearch = nameMatch || descMatch;
                const matchesCat = cat === "ALL" || p.category === cat;
                return matchesSearch && matchesCat;
            });
            renderProducts(filtered);
        }

        // إدارة الحسابات
        function toggleAuthModal() {
            document.getElementById("authModal").classList.toggle("hidden");
        }

        function loginShop() {
            const code = document.getElementById("passcodeKey").value;
            if (code === VALID_PASSCODE) {
                isLoggedIn = true;
                localStorage.setItem("isShopLoggedIn", "true");
                updateAuthUI();
                toggleAuthModal();
                renderProducts(allProducts);
                renderCart();
            } else {
                alert("رمز الدخول غير صحيح!");
            }
        }

        function updateAuthUI() {
            const btnText = document.getElementById("authBtnText");
            if (isLoggedIn) {
                btnText.innerText = "حساب محلات مفعّل";
                document.getElementById("authBtn").classList.replace("bg-blue-600", "bg-emerald-600");
            }
        }

        // إدارة السلة والطلبات
        function toggleCartModal() {
            document.getElementById("cartModal").classList.toggle("hidden");
        }

        function addToCart(product) {
            const exist = cart.find(item => item.id === product.id);
            if (exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...product, qty: 1, customInput: '' });
            }
            updateCart();
        }

        function updateQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCart();
        }

        function updateCustomInput(id, val) {
            const item = cart.find(i => i.id === id);
            if (item) item.customInput = val;
        }

        function updateCart() {
            const badge = document.getElementById("cartBadge");
            const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
            
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
            
            renderCart();
        }

        function renderCart() {
            const cartItemsContainer = document.getElementById("cartItems");
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-center text-slate-400 py-8 text-sm">السلة فارغة حالياً</p>`;
                document.getElementById("cartTotalPrice").classList.add("hidden");
                return;
            }

            let totalSum = 0;

            cartItemsContainer.innerHTML = cart.map(item => {
                const priceNum = parseFloat(item.price) || 0;
                if (isLoggedIn && priceNum) totalSum += priceNum * item.qty;

                return `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <div class="flex justify-between items-start">
                        <h5 class="font-bold text-xs text-slate-800">${item.name}</h5>
                        <div class="flex items-center gap-1.5">
                            <button onclick="updateQty('${item.id}', -1)" class="w-5 h-5 bg-slate-200 rounded text-slate-700 font-bold text-xs">-</button>
                            <span class="text-xs font-semibold px-1">${item.qty}</span>
                            <button onclick="updateQty('${item.id}', 1)" class="w-5 h-5 bg-slate-200 rounded text-slate-700 font-bold text-xs">+</button>
                        </div>
                    </div>
                    
                    ${item.requiresInput === 'true' || item.requiresInput === true ? `
                        <input type="text" onchange="updateCustomInput('${item.id}', this.value)" placeholder="أدخل IMEI أو تفاصيل الجهاز..." class="w-full mt-2 border rounded p-1.5 text-xs outline-none focus:ring-1 focus:ring-blue-500 bg-white">
                    ` : ''}

                    ${isLoggedIn && item.price ? `
                        <div class="text-left mt-1 text-xs font-bold text-blue-600">
                            ${(priceNum * item.qty)}
                        </div>
                    ` : ''}
                </div>
                `;
            }).join('');

            if (isLoggedIn && totalSum > 0) {
                document.getElementById("cartTotalPrice").classList.remove("hidden");
                document.getElementById("totalAmount").innerText = totalSum;
            }
        }

        // تحويل الطلب إلى واتساب
        function sendToWhatsApp() {
            const shopName = document.getElementById("shopNameInput").value.trim();
            if (!shopName) {
                alert("يرجى كتابة اسم المحل أو صاحب الطلب قبل المتابعة.");
                return;
            }
            if (cart.length === 0) {
                alert("السلة فارغة!");
                return;
            }

            let text = `📦 *طلب جديد من متجر الجملة*\n`;
            text += `🏪 *المحل/العميل:* ${shopName}\n`;
            text += `-----------------------------------\n\n`;

            cart.forEach((item, index) => {
                text += `${index + 1}. *${item.name}* (الكمية: ${item.qty})\n`;
                if (item.customInput) {
                    text += `   📝 البيانات: ${item.customInput}\n`;
                }
            });

            text += `\n-----------------------------------\n`;
            text += `يرجى تأكيد التوفر وإرسال تفاصيل الاستلام.`;

            const encodedText = encodeURIComponent(text);
            const whatsappURL = `https://wa.me/${MY_WHATSAPP_NUMBER}?text=${encodedText}`;
            window.open(whatsappURL, '_blank');
        }
    </script>
</body>
</html>
